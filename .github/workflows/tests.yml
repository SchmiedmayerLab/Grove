name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      grove_fhir_ref:
        description: grove-fhir branch or commit carrying the v0.2 adapter stack. Defaults to a pinned commit.
        type: string
        default: 6001474255641193c25686ff404ef6cbcc2cc3b1
      full_readiness:
        description: Schedule every package and platform instead of only the ones the change touches.
        type: boolean
        default: false
  workflow_call:
    inputs:
      run_all:
        description: Run every unit and UI test.
        type: boolean
        default: false
      grove_fhir_ref:
        description: grove-fhir branch or commit carrying the v0.2 adapter stack. Defaults to a pinned commit.
        type: string
        default: 6001474255641193c25686ff404ef6cbcc2cc3b1
      full_readiness:
        description: Schedule every package and platform instead of only the ones the change touches.
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect affected packages
    # Package.swift changes are compared through SwiftPM's evaluated manifest graph. A macOS runner
    # makes that graph include the dependencies guarded by `#if canImport(Darwin)` as well.
    runs-on: [self-hosted, macOS]
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      ui_matrix: ${{ steps.compute.outputs.ui_matrix }}
      has_jobs: ${{ steps.compute.outputs.has_jobs }}
      has_ui_jobs: ${{ steps.compute.outputs.has_ui_jobs }}
      has_fhir_conformance: ${{ steps.compute.outputs.has_fhir_conformance }}
      fhir_components: ${{ steps.compute.outputs.fhir_components }}
      affected: ${{ steps.compute.outputs.affected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history to diff against the base / previous commit
      - name: Determine changed files
        id: changes
        run: |
          BASE_SHA=""
          if [ "${{ inputs.run_all }}" = "true" ]; then
            echo "__ALL__" > changed.txt
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git diff --name-only "$BASE_SHA...HEAD" > changed.txt
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
            git diff --name-only "$BASE_SHA" "${{ github.sha }}" > changed.txt
          else
            echo "__ALL__" > changed.txt   # first push / unknown base -> test everything
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if grep -Fxq "Package.swift" changed.txt; then
            echo "manifest_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq "packages.toml" changed.txt; then
            echo "packages_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Fxq "Tests/UITestProjects.toml" changed.txt; then
            echo "ui_test_projects_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui_test_projects_changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed files:"; cat changed.txt
      - name: Evaluate package graphs
        if: steps.changes.outputs.manifest_changed == 'true' || steps.changes.outputs.packages_changed == 'true' || steps.changes.outputs.ui_test_projects_changed == 'true'
        env:
          BASE_SHA: ${{ steps.changes.outputs.base_sha }}
        run: |
          TEMP_DIRECTORY="$(mktemp -d)"
          BASE_WORKTREE="$TEMP_DIRECTORY/base"
          git worktree add --detach "$BASE_WORKTREE" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_WORKTREE"; rmdir "$TEMP_DIRECTORY"' EXIT
          cp "$BASE_WORKTREE/packages.toml" "$RUNNER_TEMP/base-packages.toml"
          if [ -f "$BASE_WORKTREE/Tests/UITestProjects.toml" ]; then
            cp "$BASE_WORKTREE/Tests/UITestProjects.toml" "$RUNNER_TEMP/base-ui-test-projects.toml"
          fi
          if [ "${{ steps.changes.outputs.manifest_changed }}" = "true" ]; then
            swift package --package-path "$BASE_WORKTREE" dump-package > "$RUNNER_TEMP/base-package.json"
            swift package dump-package > "$RUNNER_TEMP/head-package.json"
          fi
      - name: Test affected-package selection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s Scripts/Tests -p 'test_*.py'
      - name: Compute test matrix
        id: compute
        run: |
          ARGS=(changed.txt)
          if [ "${{ steps.changes.outputs.manifest_changed }}" = "true" ]; then
            ARGS+=(--base-package-dump "$RUNNER_TEMP/base-package.json")
            ARGS+=(--head-package-dump "$RUNNER_TEMP/head-package.json")
          fi
          if [ "${{ steps.changes.outputs.packages_changed }}" = "true" ] || [ "${{ steps.changes.outputs.manifest_changed }}" = "true" ]; then
            ARGS+=(--base-packages "$RUNNER_TEMP/base-packages.toml")
          fi
          if [ "${{ steps.changes.outputs.ui_test_projects_changed }}" = "true" ] && [ -f "$RUNNER_TEMP/base-ui-test-projects.toml" ]; then
            ARGS+=(--base-ui-test-projects "$RUNNER_TEMP/base-ui-test-projects.toml")
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ inputs.run_all }}" != "true" ] && [ -f .github/GROVE_FHIR_DEVELOPMENT_SCOPE ]; then
            DEVELOPMENT_SCOPE="$(sed -n '1p' .github/GROVE_FHIR_DEVELOPMENT_SCOPE)"
            ARGS+=(--development-scope "$DEVELOPMENT_SCOPE")
            echo "::warning::Temporary Grove FHIR development scope '$DEVELOPMENT_SCOPE' is active. Remove .github/GROVE_FHIR_DEVELOPMENT_SCOPE and run the full readiness workflow before merge."
          # Self-hosted runner capacity is the constraint, so a ready pull request stays scoped to what it
          # changes. Set the FULL_READINESS_ON_PULL_REQUESTS variable once capacity allows the wider matrix.
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ inputs.run_all }}" != "true" ] \
              && [ "${{ inputs.full_readiness || vars.FULL_READINESS_ON_PULL_REQUESTS }}" = "true" ]; then
            ARGS+=(--full-readiness)
          fi
          python3 Scripts/affected-test-matrix.py "${ARGS[@]}" >> "$GITHUB_OUTPUT"
      - name: Dump matrix (debug)
        env:
          AFFECTED: ${{ steps.compute.outputs.affected }}
          FHIR_COMPONENTS: ${{ steps.compute.outputs.fhir_components }}
          HAS_FHIR_CONFORMANCE: ${{ steps.compute.outputs.has_fhir_conformance }}
          HAS_JOBS: ${{ steps.compute.outputs.has_jobs }}
          MATRIX: ${{ steps.compute.outputs.matrix }}
        run: |
          echo "has_jobs = $HAS_JOBS"
          echo "has_fhir_conformance = $HAS_FHIR_CONFORMANCE"
          echo "fhir_components = $FHIR_COMPONENTS"
          echo "affected = $AFFECTED"
          JOBS=$(printf '%s' "$MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("include",[])))' 2>/dev/null || echo "?")
          echo "scheduled jobs = $JOBS"
          echo "----- generated matrix (pretty) -----"
          printf '%s' "$MATRIX" | python3 -m json.tool || printf '%s\n' "$MATRIX"
          {
            echo "## Test selection"
            echo "**has_jobs:** \`$HAS_JOBS\`  •  **scheduled jobs:** \`$JOBS\`"
            echo ""
            echo "**Affected packages:** $AFFECTED"
            echo "**Applicable FHIR producer lanes:** $FHIR_COMPONENTS"
            echo ""
            echo "<details><summary>Generated matrix JSON ($JOBS jobs)</summary>"
            echo ""
            echo '```json'
            printf '%s' "$MATRIX" | python3 -m json.tool || printf '%s\n' "$MATRIX"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.package }} (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.has_jobs == 'true'
    # Runner per job: Linux -> GitHub-hosted ubuntu; otherwise self-hosted iff packages.toml's
    # self-hosted-ci routed unit tests there (matrix.selfHosted), else GitHub-hosted macos-latest. The
    # self-hosted label set (matrix.selfHostedLabels) is the base ["self-hosted","macOS"] plus any
    # per-package `extra_runner_labels` from packages.toml (e.g. "python3.11+"), computed by
    # Scripts/affected-test-matrix.py.
    runs-on: ${{ matrix.platform == 'Linux' && 'ubuntu-latest' || (matrix.selfHosted && fromJson(matrix.selfHostedLabels) || fromJson('["macos-latest"]')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Swift
        if: matrix.platform == 'Linux'
        uses: SwiftyLab/setup-swift@v1
      - name: Test ${{ matrix.package }} on ${{ matrix.platform }}
        run: Scripts/run-package-tests.sh "${{ matrix.package }}" "${{ matrix.platform }}"
      - name: Upload .xcresult
        if: always() && matrix.platform != 'Linux'   # always upload (pass or fail); Linux is a compile-check (no .xcresult)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-${{ matrix.platform }}-Tests.xcresult
          path: ${{ matrix.package }}-${{ matrix.platform }}-Tests.xcresult

  test-ui:
    name: ${{ matrix.package }} UI (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.has_ui_jobs == 'true'
    # UI tests run on the self-hosted runner by default (packages.toml self-hosted-ci defaults to
    # ["ui"]); a package can move its UI tests to GitHub-hosted by dropping "ui" from that list.
    runs-on: ${{ matrix.selfHosted && fromJson(matrix.selfHostedLabels) || fromJson('["macos-latest"]') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: UI test ${{ matrix.package }} on ${{ matrix.platform }}
        run: Scripts/run-package-tests.sh "${{ matrix.package }}" "${{ matrix.platform }}" ui
      - name: Upload .xcresult
        if: always()   # always upload the result bundle (pass or fail)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}-${{ matrix.platform }}-UITests.xcresult
          path: ${{ matrix.package }}-${{ matrix.platform }}-UITests.xcresult

  fhir-conformance:
    name: FHIR Output Conformance
    needs: detect
    if: needs.detect.outputs.has_fhir_conformance == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: SchmiedmayerLab/grove-fhir
          path: .fhir/grove-fhir
          ref: ${{ inputs.grove_fhir_ref || vars.GROVE_FHIR_CONFORMANCE_REF || '6001474255641193c25686ff404ef6cbcc2cc3b1' }}
          persist-credentials: false
      - name: Record grove-fhir contract revision
        working-directory: .fhir/grove-fhir
        run: |
          echo "grove-fhir ref: ${{ inputs.grove_fhir_ref || vars.GROVE_FHIR_CONFORMANCE_REF || '6001474255641193c25686ff404ef6cbcc2cc3b1' }}"
          echo "grove-fhir SHA: $(git rev-parse HEAD)"
      - name: Restore built implementation guides
        id: guide-cache
        uses: actions/cache@v5
        with:
          path: |
            .fhir/grove-fhir/.build/fhir-home
            .fhir/grove-fhir/.build/fhir-tools
            .fhir/grove-fhir/mobile/output/package.tgz
            .fhir/grove-fhir/sensor/output/package.tgz
            .fhir/grove-fhir/sensorkit/output/package.tgz
            .fhir/grove-fhir/healthkit/output/package.tgz
            .fhir/grove-fhir/questionnaire/output/package.tgz
          key: grove-fhir-validation-${{ runner.os }}-${{ hashFiles('.github/GROVE_FHIR_DEVELOPMENT_SCOPE', '.fhir/grove-fhir/Gemfile.lock', '.fhir/grove-fhir/package-lock.json', '.fhir/grove-fhir/Scripts/**', '.fhir/grove-fhir/catalog/**', '.fhir/grove-fhir/mobile/**', '.fhir/grove-fhir/sensor/**', '.fhir/grove-fhir/sensorkit/**', '.fhir/grove-fhir/healthkit/**', '.fhir/grove-fhir/questionnaire/**') }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .fhir/grove-fhir/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Build active implementation guides
        if: steps.guide-cache.outputs.cache-hit != 'true'
        working-directory: .fhir/grove-fhir
        env:
          FHIR_COMPONENTS: ${{ needs.detect.outputs.fhir_components }}
        run: |
          npm ci
          IFS=',' read -r -a COMPONENTS <<< "$FHIR_COMPONENTS"
          for component in "${COMPONENTS[@]}"; do
            case "$component" in
              healthkit) ./Scripts/build-guides.sh mobile sensor healthkit ;;
              questionnaire) ./Scripts/build-guides.sh questionnaire ;;
              sensor) ./Scripts/build-guides.sh mobile sensor sensorkit ;;
              *) echo "::error::Unknown FHIR component '$component'."; exit 1 ;;
            esac
          done
      - name: Validate resources emitted by Grove
        env:
          FHIR_COMPONENTS: ${{ needs.detect.outputs.fhir_components }}
          GROVE_FHIR_REF: ${{ inputs.grove_fhir_ref || vars.GROVE_FHIR_CONFORMANCE_REF || '6001474255641193c25686ff404ef6cbcc2cc3b1' }}
        run: |
          IFS=',' read -r -a COMPONENTS <<< "$FHIR_COMPONENTS"
          for component in "${COMPONENTS[@]}"; do
            ./Scripts/validate-fhir-conformance.sh "$component"
          done

  # Single gate to use as the required status check in branch protection.
  # Does no work itself; it aggregates the unit and UI test jobs.
  # `if: always()` is required so it still runs (and reports pass/fail) when `test`
  # failed or was skipped — otherwise the gate would be skipped and a skipped required
  # check never satisfies branch protection.
  all-tests-pass:
    name: All tests pass
    if: always()
    needs: [detect, test, test-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        run: |
          echo "detect  = ${{ needs.detect.result }}"
          echo "test    = ${{ needs.test.result }}"
          echo "test-ui = ${{ needs.test-ui.result }}"
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "::error::The 'detect' job did not succeed — cannot determine which tests to run."
            exit 1
          fi
          for r in "${{ needs.test.result }}" "${{ needs.test-ui.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::One or more test jobs did not pass (result: $r)."; exit 1 ;;
            esac
          done
          echo "All required unit and UI tests passed (or were not affected)."
