name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect affected packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
      ui_matrix: ${{ steps.compute.outputs.ui_matrix }}
      trait_matrix: ${{ steps.compute.outputs.trait_matrix }}
      has_jobs: ${{ steps.compute.outputs.has_jobs }}
      has_ui_jobs: ${{ steps.compute.outputs.has_ui_jobs }}
      has_trait_jobs: ${{ steps.compute.outputs.has_trait_jobs }}
      affected: ${{ steps.compute.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff against the base / previous commit
      - name: Determine changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt
          else
            echo "__ALL__" > changed.txt   # first push / unknown base -> test everything
          fi
          echo "Changed files:"; cat changed.txt
      - name: Compute test matrix
        id: compute
        run: python3 Scripts/affected-test-matrix.py changed.txt >> "$GITHUB_OUTPUT"
      - name: Dump matrix (debug)
        env:
          AFFECTED: ${{ steps.compute.outputs.affected }}
          HAS_JOBS: ${{ steps.compute.outputs.has_jobs }}
          HAS_UI_JOBS: ${{ steps.compute.outputs.has_ui_jobs }}
          HAS_TRAIT_JOBS: ${{ steps.compute.outputs.has_trait_jobs }}
          MATRIX: ${{ steps.compute.outputs.matrix }}
          UI_MATRIX: ${{ steps.compute.outputs.ui_matrix }}
          TRAIT_MATRIX: ${{ steps.compute.outputs.trait_matrix }}
        run: |
          echo "has_jobs = $HAS_JOBS"
          echo "has_ui_jobs = $HAS_UI_JOBS"
          echo "has_trait_jobs = $HAS_TRAIT_JOBS"
          echo "affected = $AFFECTED"
          JOBS=$(printf '%s' "$MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("include",[])))' 2>/dev/null || echo "?")
          UI_JOBS=$(printf '%s' "$UI_MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("include",[])))' 2>/dev/null || echo "?")
          TRAIT_JOBS=$(printf '%s' "$TRAIT_MATRIX" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("include",[])))' 2>/dev/null || echo "?")
          echo "scheduled jobs = $JOBS"
          echo "scheduled UI jobs = $UI_JOBS"
          echo "scheduled package trait jobs = $TRAIT_JOBS"
          echo "----- generated matrix (pretty) -----"
          printf '%s' "$MATRIX" | python3 -m json.tool || printf '%s\n' "$MATRIX"
          echo "----- generated UI matrix (pretty) -----"
          printf '%s' "$UI_MATRIX" | python3 -m json.tool || printf '%s\n' "$UI_MATRIX"
          echo "----- generated package trait matrix (pretty) -----"
          printf '%s' "$TRAIT_MATRIX" | python3 -m json.tool || printf '%s\n' "$TRAIT_MATRIX"
          {
            echo "## Test selection"
            echo "**unit jobs:** \`$JOBS\`  •  **UI jobs:** \`$UI_JOBS\`  •  **package trait jobs:** \`$TRAIT_JOBS\`"
            echo ""
            echo "**Affected packages:** $AFFECTED"
            echo ""
            echo "<details><summary>Generated matrix JSON ($JOBS jobs)</summary>"
            echo ""
            echo '```json'
            printf '%s' "$MATRIX" | python3 -m json.tool || printf '%s\n' "$MATRIX"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Generated UI matrix JSON ($UI_JOBS jobs)</summary>"
            echo ""
            echo '```json'
            printf '%s' "$UI_MATRIX" | python3 -m json.tool || printf '%s\n' "$UI_MATRIX"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Generated package trait matrix JSON ($TRAIT_JOBS jobs)</summary>"
            echo ""
            echo '```json'
            printf '%s' "$TRAIT_MATRIX" | python3 -m json.tool || printf '%s\n' "$TRAIT_MATRIX"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  package_trait_builds:
    name: ${{ matrix.package }} package traits
    needs: detect
    if: needs.detect.outputs.has_trait_jobs == 'true'
    runs-on: macOS-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.trait_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.package }} package trait products
        run: Scripts/check-package-traits.py "${{ matrix.package }}"
      - name: Clean generated artifacts
        if: always()
        run: bash Scripts/cleanup-generated-artifacts.sh

  test:
    name: ${{ matrix.package }} (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.has_jobs == 'true'
    # Runner per job: Linux -> GitHub-hosted ubuntu; otherwise self-hosted iff packages.toml's
    # self-hosted-ci routed unit tests there (matrix.selfHosted), else GitHub-hosted macOS-26.
    runs-on: ${{ matrix.platform == 'Linux' && 'ubuntu-latest' || (matrix.selfHosted && fromJson('["self-hosted", "macOS"]') || fromJson('["macOS-26"]')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Swift
        if: matrix.platform == 'Linux'
        uses: SwiftyLab/setup-swift@v1
      - name: Test ${{ matrix.package }} on ${{ matrix.platform }}
        run: Scripts/run-package-tests.sh "${{ matrix.package }}" "${{ matrix.platform }}"
      - name: Upload .xcresult
        if: always() && matrix.platform != 'Linux'   # always upload (pass or fail); Linux is a compile-check (no .xcresult)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.platform }}-Tests.xcresult
          path: ${{ matrix.package }}-${{ matrix.platform }}-Tests.xcresult
      - name: Clean generated artifacts
        if: always()
        run: bash Scripts/cleanup-generated-artifacts.sh

  test-ui:
    name: ${{ matrix.package }} UI (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.has_ui_jobs == 'true'
    # UI tests run on the self-hosted runner by default (packages.toml self-hosted-ci defaults to
    # ["ui"]); a package can move its UI tests to GitHub-hosted by dropping "ui" from that list.
    runs-on: ${{ matrix.selfHosted && fromJson('["self-hosted", "macOS"]') || fromJson('["macOS-26"]') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: UI test ${{ matrix.package }} on ${{ matrix.platform }}
        run: Scripts/run-package-tests.sh "${{ matrix.package }}" "${{ matrix.platform }}" ui
      - name: Upload .xcresult
        if: always()   # always upload the result bundle (pass or fail)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.platform }}-UITests.xcresult
          path: ${{ matrix.package }}-${{ matrix.platform }}-UITests.xcresult
      - name: Clean generated artifacts
        if: always()
        run: bash Scripts/cleanup-generated-artifacts.sh

  # Single gate to use as the required status check in branch protection.
  # Does no work itself; it just aggregates the result of all `test` matrix jobs.
  # `if: always()` is required so it still runs (and reports pass/fail) when `test`
  # failed or was skipped — otherwise the gate would be skipped and a skipped required
  # check never satisfies branch protection.
  all-tests-pass:
    name: All tests pass
    if: always()
    needs: [detect, package_trait_builds, test, test-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        run: |
          echo "detect         = ${{ needs.detect.result }}"
          echo "package_trait_builds = ${{ needs.package_trait_builds.result }}"
          echo "test           = ${{ needs.test.result }}"
          echo "test-ui        = ${{ needs.test-ui.result }}"
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "::error::The 'detect' job did not succeed — cannot determine which tests to run."
            exit 1
          fi
          for r in "${{ needs.package_trait_builds.result }}" "${{ needs.test.result }}" "${{ needs.test-ui.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::One or more test or package trait build jobs did not pass (result: $r)."; exit 1 ;;
            esac
          done
          echo "All required unit tests, UI tests, and package trait builds passed (or no packages were affected)."
