name: Static Analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Match the toolchain used by the Apple test jobs.
  ANALYSIS_XCODE_VERSION: '26.6'

jobs:
  ui-test-projects:
    name: UI Test Project Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated UI test projects
        run: python3 Scripts/generate-ui-test-projects.py --check

  documentation-targets:
    name: Documentation Target Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify .spi.yml documents every library product
        run: python3 Scripts/check-documentation-targets.py

  # REUSE runs as part of the Repository Standards workflow.
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: SwiftLint
        uses: schmiedmayerlab/action-swiftlint@v4
        with:
          args: --strict

  periphery:
    name: Dead Code Analysis
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.ANALYSIS_XCODE_VERSION }}
      - name: Use selected Xcode for this job
        # The runner's inherited DEVELOPER_DIR takes precedence over xcode-select.
        run: echo "DEVELOPER_DIR=$MD_APPLE_SDK_ROOT/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install Periphery
        run: brew install periphery
      - name: Periphery
        env:
          # Authenticate package fetches across the shared runner fleet.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: Scripts/run-periphery.sh --strict

  documentation:
    name: Documentation
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.ANALYSIS_XCODE_VERSION }}
      - name: Use selected Xcode for this job
        # The runner's inherited DEVELOPER_DIR takes precedence over xcode-select.
        run: echo "DEVELOPER_DIR=$MD_APPLE_SDK_ROOT/Contents/Developer" >> "$GITHUB_ENV"
      - name: Build DocC Documentation
        env:
          # Authenticate package fetches across the shared runner fleet.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: python3 Scripts/build-documentation.py
      - name: Clean generated artifacts
        if: always()
        run: bash Scripts/cleanup-generated-artifacts.sh
