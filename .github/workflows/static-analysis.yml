name: Static Analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-test-projects:
    name: UI Test Project Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated UI test projects
        run: python3 Scripts/generate-ui-test-projects.py --check

  generated-sources:
    name: Generated Source Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gyb
        # Pinned: gyb from a moving branch could flip this check with no change in this repository.
        env:
          SWIFT_TAG: swift-6.1.2-RELEASE
        run: curl -fsSL "https://raw.githubusercontent.com/apple/swift/$SWIFT_TAG/utils/gyb.py" -o "$RUNNER_TEMP/gyb.py"
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1
      - name: Resolve packages
        # FHIR+ExtensionUtils.swift.gyb reads the ModelsR4 sources out of the resolved checkout.
        run: swift package resolve
      - name: Verify every gyb template matches its committed output
        run: GYB="$RUNNER_TEMP/gyb.py" Scripts/check-gyb-output.sh

  documentation-targets:
    name: Documentation Target Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify .spi.yml documents every library product
        run: python3 Scripts/check-documentation-targets.py

  # REUSE runs as part of the Repository Standards workflow.
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: SwiftLint
        uses: schmiedmayerlab/action-swiftlint@v4
        with:
          args: --strict

  periphery:
    name: Dead Code Analysis
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Periphery
        run: brew install periphery
      - name: Periphery
        run: Scripts/run-periphery.sh --strict

  documentation:
    name: Documentation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build DocC Documentation
        run: Scripts/build-documentation.sh
      - name: Clean generated artifacts
        if: always()
        run: bash Scripts/cleanup-generated-artifacts.sh
