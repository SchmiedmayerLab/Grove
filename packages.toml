[GroveQuestionnaire]
platforms = ["iOS", "macOS", "Linux"]
targets = ["GroveQuestionnaire", "GroveQuestionnaireUI", "GroveQuestionnaireCatalog", "GroveQuestionnaireFHIR", "GroveQuestionnaireExtraction", "GroveQuestionnaireLegacy", "GroveQuestionnaireMacros", "GroveQuestionnaireMacrosImpl", "XCTGroveQuestionnaire"]
tests = ["GroveQuestionnaireTests", "GroveQuestionnaireExtractionTests", "GroveQuestionnaireMacrosTests"]
testPlatforms = { GroveQuestionnaireMacrosTests = ["macOS"] }
uiTests = ["iOS", "iPadOS"]
# The longest UI suite by far: run one at a time it holds up the whole test workflow.
uiParallelWorkers = 4
# Everything that treats a questionnaire as data builds off-Apple; only GroveQuestionnaireUI,
# which renders it, is Apple-bound. The annotate-image kind goes with the UI: its config names an
# image asset and its answer is a PencilKit drawing, so off-Apple it is neither parsed nor encoded.
linuxTargets = ["GroveQuestionnaire", "GroveQuestionnaireCatalog", "GroveQuestionnaireFHIR", "GroveQuestionnaireExtraction", "GroveQuestionnaireExtractionTests"]

