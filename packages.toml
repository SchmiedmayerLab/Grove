tests = ["GroveLLMTests"]
# The tests pull in GroveChat and the on-device targets; the inference core and the remote providers
# are what a server actually uses, so those are what Linux checks.
linuxTargets = ["GroveLLM", "GeneratedOpenAIClient", "GroveLLMOpenAI", "GroveLLMAnthropic", "GroveLLMGemini"]
uiTests = ["iOS", "iPadOS", "visionOS"]

