# This package's self-hosted jobs run run-package-tests.sh's tomllib path (Python 3.11+); pin them
# to a self-hosted runner carrying the `python3.11+` label (older self-hosted machines have < 3.11).
extra_runner_labels = ["python3.11+"]

[XCTestExtensions]
platforms = ["iOS", "macOS", "watchOS", "visionOS"]
targets = ["XCTestExtensions", "XCTestApp"]
tests = ["XCTestExtensionsTests"]
uiTests = ["iOS", "iPadOS", "visionOS"]
