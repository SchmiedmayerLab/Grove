# Formerly a standalone HealthKit-to-FHIR package, merged into this monorepo (see Package.swift). Kept as its own scheduling entry rather than folded into [GroveHealthKit], so its
# UITests project keeps a home and CI stays granular -- the test matrix is directory-based.
[GroveHealthKitFHIR]
platforms = ["iOS", "macOS", "watchOS"]
targets = ["GroveHealthKitFHIR"]
tests = ["GroveHealthKitFHIRTests"]
uiTests = ["iOS"]

