# List of logical sub-packages within the monorepo
#
# Each entry is a logical sub-package within the monorepo: a collection of targets that belong
# together to implement a set of APIs. Used to map changed files -> affected sub-package -> tests.
#   platforms = the platforms the sub-package's upstream repo tested on (CI may schedule a subset).
#               "Linux" is recorded where upstream ran `swift test` on Linux; it is not yet scheduled
#               (xcodebuild CI is Apple-only) and GroveAccount lists iOS deliberately (some tests fail).
#   targets   = its source target directories  (Sources/<name>)
#   tests     = its test target directories     (Tests/<name>; a Tests/<name>/UITests/ subfolder counts too)
#   linuxTargets = optional; what the Linux leg compile-checks instead of `tests`, for a package whose
#               test target is Apple-only but whose sources build on Linux.
#   uiTests   = the platforms its UITests Xcode project runs on (absent = no UI tests).
#   uiParallelWorkers = optional; how many simulator clones its UI tests are spread across. Absent (or 1)
#               runs them one at a time on the destination itself. Each clone launches its own copy of
#               the app, so this pays off only for a long suite whose tests do not depend on each other.
#               The UI_WORKERS environment variable overrides it for a local run.
#   self-hosted-ci = which test kinds are pinned to the self-hosted runner: a subset of ["unit", "ui"].
#               Optional; defaults to ["ui"]. UI tests not listed run GitHub-hosted. Unit tests not
#               pinned either way go to whichever runner pool is expected to finish them first
#               (Scripts/refresh-ci-durations.py). Add "unit" (e.g. ["unit", "ui"]) for tests that need
#               more CPU cores (e.g. RuntimeAssertions, whose cooperative-pool-blocking tests starve on
#               the few-vCPU GitHub runner) or whose snapshot references match only the self-hosted
#               runner's Xcode. Linux unit jobs always stay on GitHub-hosted ubuntu
#               regardless (the self-hosted runner is macOS).
#   github-hosted-ci = optional ["unit"]: pins the unit tests to GitHub-hosted runners, e.g. while a
#               test fails only on the self-hosted runner.
# Note: GroveFoundation's "CZlib" is a directory name (Sources/CZlib); its Swift target is "GroveCZlib".

[FHIRModelsExtensions]
platforms = ["iOS", "macOS", "macCatalyst", "watchOS", "visionOS", "tvOS", "Linux"]
targets = ["FHIRModelsExtensions", "FHIRPathParser", "FHIRQuestionnaires"]
tests = ["FHIRModelsExtensionsTests", "FHIRPathParserTests"]
# Pure FHIR data handling, so the whole package compiles off-Apple; the test targets build
# there too, which checks more than the sources alone.
linuxTargets = ["FHIRQuestionnaires", "FHIRModelsExtensionsTests", "FHIRPathParserTests"]

[ResearchKitOnFHIR]
platforms = ["iOS"]
targets = ["ResearchKitOnFHIR"]
tests = ["ResearchKitOnFHIRTests"]
uiTests = ["iOS"]

[Grove]
platforms = ["iOS", "macOS", "macCatalyst", "watchOS", "visionOS", "tvOS", "Linux"]
targets = ["Grove", "GroveTesting", "XCTGrove"]
tests = ["GroveTests"]
uiTests = ["iOS", "visionOS"]

[GroveAccessGuard]
platforms = ["iOS"]
targets = ["GroveAccessGuard"]
tests = ["GroveAccessGuardTests"]
