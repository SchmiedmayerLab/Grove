version = 1

# Union of the per-package REUSE.toml annotations (and GroveAccount's older .reuse/dep5) from the
# original repositories. The original repos used the Sources/<target> and Tests/<testTarget> layout
# the monorepo preserves, so paths need no adjustment except the UITest TestApp resources, which are
# nested under each package's test dir here (originally Tests/UITests/TestApp/Resources/** per repo).
# Copyright years are kept as they were upstream — these annotate files authored in the upstream repos.

# Upstream annotations dated 2024 (GroveAccount via .reuse/dep5; GroveViews).
[[annotations]]
path = [
    "Tests/GroveAccountTests/__Snapshots__/**",
    "Tests/GroveViewsTests/__Snapshots__/**"
]
SPDX-FileCopyrightText = "2024 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Upstream annotations dated 2025.
[[annotations]]
path = [
    "Sources/FHIRPathParser/Generated/**",
    "Sources/FHIRQuestionnaires/Resources/**",
    "Sources/GroveConsent/GroveConsent.docc/Resources/**",
    "Sources/GroveLicense/GroveLicense.docc/Resources/**",
    "Sources/GroveOnboarding/GroveOnboarding.docc/Resources/**",
    "Tests/GroveAccessGuardTests/__Snapshots__/**",
    "Tests/GroveConsentTests/Resources/**",
    "Tests/GroveConsentTests/__Snapshots__/**",
    "Tests/GroveConsentTests/UITests/TestApp/Resources/**",
    "Tests/GroveHealthKitTests/__Snapshots__/**",
    "Tests/GroveSchedulerTests/Resources/**",
    "Tests/GroveSchedulerUITests/__Snapshots__/**",
    "Tests/GroveStudyTests/Resources/**",
    "Tests/GroveStudyTests/UITests/TestApp/Resources/**"
]
SPDX-FileCopyrightText = "2025 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Upstream annotations dated 2026 (GroveQuestionnaire).
[[annotations]]
path = [
    "Tests/GroveQuestionnaireTests/Resources/**",
    "Tests/GroveQuestionnaireTests/UITests/TestApp/Resources/**"
]
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"

# Monorepo infrastructure created during the migration (2026) that can't carry an inline SPDX header
# (JSON test plans, Xcode project files, the shared Xcode test-host scheme, and the size-constrained SPI manifest).
[[annotations]]
path = [
    "Tests/TestPlans/**",
    "**/project.pbxproj",
    ".swiftpm/xcode/xcshareddata/xcschemes/Grove-Tests.xcscheme",
    ".spi.yml"
]
SPDX-FileCopyrightText = "2026 Stanford University and the project authors (see CONTRIBUTORS.md)"
SPDX-License-Identifier = "MIT"
