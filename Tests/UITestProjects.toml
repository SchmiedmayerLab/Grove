#
# Direct product dependencies and the few build-setting exceptions for generated UI-test projects.
# Platform and device-family declarations are derived from packages.toml.
# Fixture products are intentional non-imported dependencies needed for runtime test behavior.
# `traits` enables the listed monorepo package traits on the project's package reference, for
# TestApps whose products require them (CI additionally enables all default traits via the
# GROVE_ENABLE_DEFAULT_PACKAGE_TRAITS environment variable; the project-level declaration is what
# makes the TestApp build in Xcode and in plain xcodebuild invocations).

[GroveHealthKitFHIR]
app_products = ["GroveHealthKitFHIR", "Grove", "GroveHealthKit"]
test_products = ["XCTHealthKit", "XCTestExtensions"]
[GroveHealthKitFHIR.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/Support Files/TestApp.entitlements"
"INFOPLIST_KEY_NSHealthClinicalHealthRecordsShareUsageDescription" = "Please provide health records access to test"
"INFOPLIST_KEY_NSHealthShareUsageDescription" = "Please provide read permission to test the module's functionality."
"INFOPLIST_KEY_NSHealthUpdateUsageDescription" = "Please provide update permission to test the module's functionality."

[ResearchKitOnFHIR]
app_products = ["FHIRQuestionnaires", "ResearchKitOnFHIR"]
traits = ["ResearchKit"]
[ResearchKitOnFHIR.app_settings]
"INFOPLIST_KEY_NSCameraUsageDescription" = "Uses camera to test image capture"

[GroveAccessGuard]
app_products = ["Grove", "GroveAccessGuard", "GroveFoundation", "GroveViews"]
[GroveAccessGuard.app_settings]
"INFOPLIST_KEY_CFBundleAllowMixedLocalizations" = "YES"
"INFOPLIST_KEY_NSFaceIDUsageDescription" = "Used to test biometric-based authentication."

[GroveAccount]
app_products = ["ArgumentParser", "Grove", "GroveAccount", "GroveAccountPhoneNumbers", "GroveValidation", "GroveViews"]
test_products = ["XCTestExtensions", "XCTGroveAccount"]
[GroveAccount.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
"INFOPLIST_KEY_CFBundleAllowMixedLocalizations" = "YES"
[[GroveAccount.remote_packages]]
url = "https://github.com/apple/swift-argument-parser.git"
kind = "upToNextMajorVersion"
minimum_version = "1.0.0"
products = ["ArgumentParser"]

[GroveBluetooth]
app_products = ["ByteCoding", "Grove", "GroveBluetooth", "GroveBluetoothServices", "GroveViews"]
test_products = ["GroveBluetooth", "GroveBluetoothServices", "XCTestExtensions"]
[GroveBluetooth.app_settings]
"INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription" = "This App uses Bluetooth to connect to nearby devices."

[GroveChat]
app_products = ["GroveChat"]
test_products = ["XCTestExtensions"]
[GroveChat.app_settings]
"INFOPLIST_KEY_NSMicrophoneUsageDescription" = "Microphone used to record voice for text input."
"INFOPLIST_KEY_NSSpeechRecognitionUsageDescription" = "Speech recognition necessary for transcribing voice input."

[GroveConsent]
app_products = ["Grove", "GroveConsent", "GroveFoundation", "GroveOnboarding", "GroveViews"]
test_products = ["GroveFoundation", "XCTestExtensions"]

[GroveContact]
app_products = ["GroveContact"]

[GroveDevices]
app_products = ["ByteCoding", "Grove", "GroveBluetooth", "GroveBluetoothServices", "GroveDevices", "GroveDevicesUI", "GroveOmron", "GroveViews"]
test_products = ["XCTestExtensions"]
[GroveDevices.app_settings]
"INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription" = "Uses Bluetooth for testing."

[GroveFHIR]
app_products = ["Grove", "GroveFHIR", "GroveHealthKitFHIR", "GroveFHIRMockPatients", "GroveHealthKit", "GroveViews"]
test_products = ["XCTestExtensions"]
[GroveFHIR.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
"INFOPLIST_KEY_NSHealthClinicalHealthRecordsShareUsageDescription" = "The Test App uses the health data to test the Grove FHIR Package."
"INFOPLIST_KEY_NSHealthShareUsageDescription" = "The TestApp accesses your HealthKit data to run the tests."
"INFOPLIST_KEY_NSHealthUpdateUsageDescription" = "The Test App uses the health data to test the Grove FHIR Package."

[GroveFirebase]
app_products = ["Grove", "GroveAccount", "GroveFirebaseAccount", "GroveFirebaseAccountStorage", "GroveFirestore", "GroveFirebaseStorage", "GrovePersonalInfo", "GroveValidation", "GroveViews"]
test_products = ["XCTestExtensions", "XCTGroveAccount"]
[GroveFirebase.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
[GroveFirebase.test_settings]
"INFOPLIST_FILE" = "TestAppUITests/Info.plist"

[GroveFoundation]
app_products = ["GroveFoundation"]
test_products = ["XCTestExtensions"]

[GroveHealthKit]
app_products = ["Algorithms", "Grove", "GroveFoundation", "GroveHealthKit", "GroveHealthKitBulkExport", "GroveHealthKitUI", "GroveViews"]
test_products = ["XCTestExtensions", "GroveHealthKit", "XCTHealthKit"]
[GroveHealthKit.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
"INFOPLIST_KEY_CFBundleAllowMixedLocalizations" = "YES"
"INFOPLIST_KEY_NSHealthShareUsageDescription" = "The TestApp accesses your HealthKit data to run the tests."
"INFOPLIST_KEY_NSHealthUpdateUsageDescription" = "The TestApp writes test samples to your HealthKit database to have testing data. There is a mechanism for deleting this (and only this!!!) data."
[[GroveHealthKit.remote_packages]]
url = "https://github.com/apple/swift-algorithms.git"
kind = "upToNextMajorVersion"
minimum_version = "1.2.1"
products = ["Algorithms"]

[GroveLLM]
app_products = ["Grove", "GroveChat", "GroveKeychainStorage", "GroveLLM", "GroveLLMAnthropic", "GroveLLMFoundationModels", "GroveLLMGemini", "GroveLLMLocal", "GroveLLMLocalDownload", "GroveLLMOpenAI", "GroveLLMOpenAIRealtime", "GroveOnboarding", "GroveViews"]
test_products = ["XCTestExtensions"]
traits = ["MLX"]
[GroveLLM.app_settings]
"INFOPLIST_KEY_NSMicrophoneUsageDescription" = "The Test Application uses the micophone to test the dication functionality."
"INFOPLIST_KEY_NSSpeechRecognitionUsageDescription" = "Speech recognition necessary for transcribing voice input."

[GroveLicense]
app_products = ["GroveLicense"]
app_fixture_products = ["libzstd"] # The UI test verifies that zstd appears in the generated license list.
app_plugins = ["SwiftPackageListPlugin"]
[[GroveLicense.remote_packages]]
url = "https://github.com/FelixHerrmann/swift-package-list"
kind = "upToNextMajorVersion"
minimum_version = "4.10.0"
products = ["SwiftPackageListPlugin"]
[[GroveLicense.remote_packages]]
url = "https://github.com/SchmiedmayerLab/zstd.git"
kind = "exactVersion"
version = "1.5.8-beta.1"
products = ["libzstd"]

[GroveLocation]
app_products = ["Grove", "GroveLocation"]
test_products = ["XCTestExtensions"]
[GroveLocation.app_settings]
"INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription" = "Used for testing location module."
"INFOPLIST_KEY_NSLocationWhenInUseUsageDescription" = "Used for testing location module."

[GroveNotifications]
app_products = ["Grove", "GroveNotifications", "GroveViews", "XCTGroveNotificationsUI"]
test_products = ["XCTGroveNotifications", "XCTestExtensions"]
[GroveNotifications.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"

[GroveOnboarding]
app_products = ["Grove", "GroveFoundation", "GroveOnboarding", "GroveViews"]
test_products = ["XCTestExtensions"]

[GroveQuestionnaire]
app_products = ["FHIRQuestionnaires", "GroveQuestionnaire", "GroveQuestionnaireCatalog", "GroveQuestionnaireFHIR", "GroveViews"]
test_products = ["XCTGroveQuestionnaire", "XCTestExtensions"]
# Linked but not imported; kept so the linkage stays as it was.
test_fixture_products = ["GroveFoundation"]
traits = ["ResearchKit"]
[GroveScheduler]
app_products = ["Grove", "GroveFoundation", "GroveNotifications", "GroveScheduler", "GroveSchedulerUI", "GroveViews", "XCTGroveNotificationsUI", "XCTestApp"]
test_products = ["XCTestExtensions", "XCTGroveNotifications"]
# Linked but not imported; kept so the linkage stays as it was.
test_fixture_products = ["GroveFoundation"]
[GroveScheduler.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
"INFOPLIST_FILE" = "TestApp/Info.plist"

[GroveSensorKit]
app_products = ["GroveSensorKit"]

[GroveSpeech]
app_products = ["Grove", "GroveSpeechRecognizer", "GroveSpeechSynthesizer"]
[GroveSpeech.app_settings]
"INFOPLIST_KEY_NSMicrophoneUsageDescription" = "This app needs access to your microphone for voice input."
"INFOPLIST_KEY_NSSpeechRecognitionUsageDescription" = "This app needs access to Speech recognition in order to translate voice input."

[GroveStorage]
app_products = ["Grove", "GroveKeychainStorage", "GroveLocalStorage", "XCTestApp"]
test_products = ["XCTestExtensions"]
[GroveStorage.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"

[GroveStudy]
app_products = ["Grove", "GroveFoundation", "GroveHealthKit", "GroveLocalization", "GroveScheduler", "GroveSchedulerUI", "GroveStudy", "GroveStudyDefinition", "GroveViews"]
test_products = ["XCTHealthKit", "XCTestExtensions"]
[GroveStudy.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
"INFOPLIST_KEY_NSHealthShareUsageDescription" = "The app can perform automated collection of Health data, if the user consents"
[Grove]
app_products = ["XCTestApp", "Grove"]
test_products = ["XCTestExtensions"]
[Grove.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"

[GroveViews]
app_products = ["GroveViews", "XCTestApp", "GrovePersonalInfo", "GroveValidation", "Grove", "GroveFoundation"]
test_products = ["XCTestExtensions", "Algorithms"]
# Linked but not imported; kept so the linkage stays as it was.
test_fixture_products = ["GroveFoundation"]
[[GroveViews.remote_packages]]
url = "https://github.com/apple/swift-algorithms.git"
kind = "upToNextMajorVersion"
minimum_version = "1.2.1"
products = ["Algorithms"]

[XCTHealthKit]
test_products = ["XCTHealthKit", "XCTestExtensions"]
[XCTHealthKit.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
"INFOPLIST_KEY_NSHealthClinicalHealthRecordsShareUsageDescription" = "The Test App needs access to the HealthKit records to enable unit tests."
"INFOPLIST_KEY_NSHealthShareUsageDescription" = "The Test App needs access to the HealthKit records to enable unit tests."

[XCTestExtensions]
app_products = ["XCTestApp"]
test_products = ["XCTestExtensions"]
[XCTestExtensions.app_settings]
"CODE_SIGN_ENTITLEMENTS" = "TestApp/TestApp.entitlements"
"INFOPLIST_FILE" = "TestApp/Info.plist"
"INFOPLIST_KEY_NSHealthShareUsageDescription" = "The Test App needs access to the HealthKit records to enable unit tests."
